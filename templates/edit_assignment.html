{% extends "base.html" %}

{% block title %}Edit Assignment - MyDailyFlow{% endblock %}

{% block content %}
<div class="form-page">
    <div class="page-header">
        <h2>✏️ Edit Assignment</h2>
        <p>Update assignment details</p>
    </div>

    <div class="form-container">
        <form method="POST" action="{{ url_for('edit_assignment', id=assignment.id) }}" class="modern-form">
            <div class="form-group">
                <label for="title">Assignment Title *</label>
                <input type="text" 
                       id="title" 
                       name="title" 
                       value="{{ assignment.title }}"
                       required 
                       class="form-input">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="subject">Subject *</label>
                    <select id="subject" name="subject" required class="form-select">
                        <option value="Mathematics" {% if assignment.subject == 'Mathematics' %}selected{% endif %}>Mathematics</option>
                        <option value="Computer Science" {% if assignment.subject == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                        <option value="Physics" {% if assignment.subject == 'Physics' %}selected{% endif %}>Physics</option>
                        <option value="Chemistry" {% if assignment.subject == 'Chemistry' %}selected{% endif %}>Chemistry</option>
                        <option value="Biology" {% if assignment.subject == 'Biology' %}selected{% endif %}>Biology</option>
                        <option value="English" {% if assignment.subject == 'English' %}selected{% endif %}>English</option>
                        <option value="History" {% if assignment.subject == 'History' %}selected{% endif %}>History</option>
                        <option value="Economics" {% if assignment.subject == 'Economics' %}selected{% endif %}>Economics</option>
                        <option value="Business" {% if assignment.subject == 'Business' %}selected{% endif %}>Business</option>
                        <option value="Other" {% if assignment.subject == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="due_date">Due Date *</label>
                    <input type="date" 
                           id="due_date" 
                           name="due_date" 
                           value="{{ assignment.due_date.strftime('%Y-%m-%d') }}"
                           required 
                           class="form-input">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="priority">Priority Level *</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="priority" value="Low" {% if assignment.priority == 'Low' %}checked{% endif %} required>
                            <span class="radio-custom priority-low">Low</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="priority" value="Medium" {% if assignment.priority == 'Medium' %}checked{% endif %} required>
                            <span class="radio-custom priority-medium">Medium</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="priority" value="High" {% if assignment.priority == 'High' %}checked{% endif %} required>
                            <span class="radio-custom priority-high">High</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required class="form-select">
                        <option value="Pending" {% if assignment.status == 'Pending' %}selected{% endif %}>Pending</option>
                        <option value="Completed" {% if assignment.status == 'Completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" 
                          name="description" 
                          rows="4" 
                          class="form-textarea">{{ assignment.description or '' }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">✓ Update Assignment</button>
                <a href="{{ url_for('assignments') }}" class="btn btn-secondary">Cancel</a>
                <a href="{{ url_for('delete_assignment', id=assignment.id) }}" 
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure you want to delete this assignment?')">🗑️ Delete</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
